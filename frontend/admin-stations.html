<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Stations — FireSYS</title>
<link rel="stylesheet" href="css/design-system.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
</head>
<body>
  <script src="js/auth.js"></script>
  <script src="js/app-shell.js"></script>
  <script>
    const session = requireAuth('Admin');
    let allStations = [];
    let currentPage = 1;
    const PAGE_SIZE = 8;
    let searchTerm = '';

    if (session) {
      renderShell({
        session,
        activeHref: 'admin-stations.html',
        pageTitle: 'Manage Stations',
        pageSubtitle: 'Physical fire stations and the fleet/crew attached to each.',
      });

      document.getElementById('pageHeaderActions').innerHTML = `
        <button class="btn btn-primary" id="addStationBtn"><i data-lucide="building-2" class="icon"></i> Add station</button>
      `;

      document.getElementById('pageBody').innerHTML = `
        <div class="card panel">
          <div class="table-toolbar">
            <div class="table-toolbar-left">
              <div class="search-bar" style="width:260px;">
                <i data-lucide="search" class="icon" style="width:15px;height:15px;"></i>
                <input type="text" id="searchInput" placeholder="Search station name or address…">
              </div>
            </div>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>Station</th><th>Address</th><th>Phone</th><th>Trucks</th><th>Firefighters</th><th></th></tr></thead>
              <tbody id="stationsTbody">${skeletonRows(6, 5)}</tbody>
            </table>
          </div>
          <div class="table-pagination">
            <span id="paginationInfo"></span>
            <div class="pagination-btns" id="paginationBtns"></div>
          </div>
        </div>
      `;

      document.getElementById('addStationBtn').addEventListener('click', () => openStationModal());
      document.getElementById('searchInput').addEventListener('input', (e) => { searchTerm = e.target.value.toLowerCase(); currentPage = 1; renderTable(); });

      if (window.lucide) window.lucide.createIcons();
      loadStations();
    }

    async function loadStations() {
      try {
        allStations = await apiAuth('/stations');
        renderTable();
      } catch (err) {
        showToast(err.message, 'danger');
      }
    }

    function filtered() {
      return allStations.filter((s) => !searchTerm || s.name.toLowerCase().includes(searchTerm) || (s.address || '').toLowerCase().includes(searchTerm));
    }

    function renderTable() {
      const tbody = document.getElementById('stationsTbody');
      const rows = filtered();
      const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
      currentPage = Math.min(currentPage, totalPages);
      const pageRows = rows.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

      if (!pageRows.length) {
        tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><div class="icon-wrap"><i data-lucide="building-2" class="icon"></i></div><h4>No stations found</h4><p>Try a different search.</p></div></td></tr>`;
      } else {
        tbody.innerHTML = pageRows.map((s) => `
          <tr>
            <td style="font-weight:600;">${s.name}</td>
            <td>${s.address || '—'}</td>
            <td>${s.phone || '—'}</td>
            <td><span class="badge badge-info">${s.truck_count}</span></td>
            <td><span class="badge badge-info">${s.firefighter_count}</span></td>
            <td>
              <div class="row-actions">
                <button class="btn-icon" title="Edit" onclick="openStationModal(${s.id})"><i data-lucide="pencil" class="icon" style="width:15px;height:15px;"></i></button>
                <button class="btn-icon" title="Delete" onclick="confirmDelete(${s.id})"><i data-lucide="trash-2" class="icon" style="width:15px;height:15px;"></i></button>
              </div>
            </td>
          </tr>
        `).join('');
      }

      document.getElementById('paginationInfo').textContent = rows.length
        ? `Showing ${(currentPage - 1) * PAGE_SIZE + 1}–${Math.min(currentPage * PAGE_SIZE, rows.length)} of ${rows.length}`
        : 'No results';

      const btns = document.getElementById('paginationBtns');
      let html = `<button ${currentPage === 1 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1})"><i data-lucide="chevron-left" class="icon" style="width:14px;height:14px;"></i></button>`;
      for (let i = 1; i <= totalPages; i++) html += `<button class="${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
      html += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="goToPage(${currentPage + 1})"><i data-lucide="chevron-right" class="icon" style="width:14px;height:14px;"></i></button>`;
      btns.innerHTML = html;

      if (window.lucide) window.lucide.createIcons();
    }

    function goToPage(p) { currentPage = p; renderTable(); }

    function openStationModal(id) {
      const existing = id ? allStations.find((s) => s.id === id) : null;
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal card">
          <div class="modal-header">
            <h3>${existing ? 'Edit station' : 'Add station'}</h3>
            <button class="modal-close" id="closeModal"><i data-lucide="x" class="icon"></i></button>
          </div>
          <div id="modalBanner" class="banner banner-danger hidden"><i data-lucide="alert-circle" class="icon"></i><span></span></div>
          <form id="stationForm" novalidate>
            <div class="field"><input type="text" id="mName" placeholder=" " value="${existing?.name || ''}" required><label>Station name</label></div>
            <div class="field"><input type="text" id="mAddress" placeholder=" " value="${existing?.address || ''}"><label>Address</label></div>
            <div class="field"><input type="text" id="mPhone" placeholder=" " value="${existing?.phone || ''}"><label>Phone</label></div>
          </form>
          <div class="modal-footer">
            <button class="btn btn-secondary" id="cancelModal">Cancel</button>
            <button class="btn btn-primary" id="saveModal">${existing ? 'Save changes' : 'Add station'}</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      requestAnimationFrame(() => overlay.classList.add('open'));
      if (window.lucide) window.lucide.createIcons();

      const close = () => { overlay.classList.remove('open'); setTimeout(() => overlay.remove(), 200); };
      overlay.querySelector('#closeModal').addEventListener('click', close);
      overlay.querySelector('#cancelModal').addEventListener('click', close);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });

      overlay.querySelector('#saveModal').addEventListener('click', async () => {
        const btn = overlay.querySelector('#saveModal');
        const banner = overlay.querySelector('#modalBanner');
        const name = overlay.querySelector('#mName').value.trim();
        const address = overlay.querySelector('#mAddress').value.trim() || null;
        const phone = overlay.querySelector('#mPhone').value.trim() || null;
        if (!name) { banner.classList.remove('hidden'); banner.querySelector('span').textContent = 'Station name is required.'; return; }
        try {
          if (existing) {
            setButtonLoading(btn, true, 'Saving…');
            await apiAuth(`/stations/${existing.id}`, { method: 'PUT', body: JSON.stringify({ name, address, phone }) });
            showToast('Station updated.', 'success');
          } else {
            setButtonLoading(btn, true, 'Adding…');
            await apiAuth('/stations', { method: 'POST', body: JSON.stringify({ name, address, phone }) });
            showToast('Station added.', 'success');
          }
          close();
          loadStations();
        } catch (err) {
          banner.classList.remove('hidden');
          banner.querySelector('span').textContent = err.message;
          setButtonLoading(btn, false);
        }
      });
    }

    function confirmDelete(id) {
      const station = allStations.find((s) => s.id === id);
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal card" style="max-width:380px;">
          <div class="modal-header"><h3>Delete station?</h3><button class="modal-close" id="closeConfirm"><i data-lucide="x" class="icon"></i></button></div>
          <p style="font-size:13.5px; color:var(--text-secondary);">${station.name} will be permanently removed. Trucks and firefighters attached to it will become unassigned.</p>
          <div class="modal-footer">
            <button class="btn btn-secondary" id="cancelConfirm">Cancel</button>
            <button class="btn btn-primary" style="background:var(--color-danger);" id="confirmBtn">Delete</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      requestAnimationFrame(() => overlay.classList.add('open'));
      if (window.lucide) window.lucide.createIcons();

      const close = () => { overlay.classList.remove('open'); setTimeout(() => overlay.remove(), 200); };
      overlay.querySelector('#closeConfirm').addEventListener('click', close);
      overlay.querySelector('#cancelConfirm').addEventListener('click', close);
      overlay.querySelector('#confirmBtn').addEventListener('click', async () => {
        try {
          await apiAuth(`/stations/${id}`, { method: 'DELETE' });
          showToast('Station deleted.', 'success');
          close();
          loadStations();
        } catch (err) {
          showToast(err.message, 'danger');
        }
      });
    }
  </script>
</body>
</html>
