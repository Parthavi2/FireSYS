<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Active Incidents — FireSYS</title>
<link rel="stylesheet" href="css/design-system.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
</head>
<body>
  <script src="js/auth.js"></script>
  <script src="js/app-shell.js"></script>
  <script>
    const session = requireAuth('Dispatcher');
    let allIncidents = [];
    let trucks = [];
    let currentPage = 1;
    const PAGE_SIZE = 8;
    let statusFilter = 'All';
    let searchTerm = '';

    const STATUS_BADGE = { Active: 'badge-danger', 'In Progress': 'badge-warning', Resolved: 'badge-success' };
    const SEVERITY_BADGE = { Critical: 'badge-danger', High: 'badge-warning', Medium: 'badge-info', Low: 'badge-neutral' };

    if (session) {
      renderShell({
        session,
        activeHref: 'dispatcher-incidents.html',
        pageTitle: 'Active incidents',
        pageSubtitle: 'Create, assign, track, and resolve incidents in real time.',
      });

      document.getElementById('pageHeaderActions').innerHTML = `
        <button class="btn btn-primary" id="createBtn"><i data-lucide="siren" class="icon"></i> Create incident</button>
      `;

      document.getElementById('pageBody').innerHTML = `
        <div class="card panel">
          <div class="table-toolbar">
            <div class="table-toolbar-left">
              <div class="search-bar" style="width:240px;">
                <i data-lucide="search" class="icon" style="width:15px;height:15px;"></i>
                <input type="text" id="searchInput" placeholder="Search location or type…">
              </div>
              <select class="filter-select" id="statusFilterEl">
                <option value="All">All statuses</option>
                <option>Active</option><option>In Progress</option><option>Resolved</option>
              </select>
            </div>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>Location</th><th>Type</th><th>Severity</th><th>Status</th><th></th></tr></thead>
              <tbody id="incidentsTbody">${skeletonRows(5, 5)}</tbody>
            </table>
          </div>
          <div class="table-pagination">
            <span id="paginationInfo"></span>
            <div class="pagination-btns" id="paginationBtns"></div>
          </div>
        </div>
      `;

      document.getElementById('createBtn').addEventListener('click', () => openCreateModal());
      document.getElementById('searchInput').addEventListener('input', (e) => { searchTerm = e.target.value.toLowerCase(); currentPage = 1; renderTable(); });
      document.getElementById('statusFilterEl').addEventListener('change', (e) => { statusFilter = e.target.value; currentPage = 1; renderTable(); });

      if (window.lucide) window.lucide.createIcons();
      loadData();
    }

    async function loadData() {
      try {
        const [incidents, truckList] = await Promise.all([apiAuth('/incidents'), apiAuth('/trucks')]);
        allIncidents = incidents;
        trucks = truckList;
        renderTable();
      } catch (err) {
        showToast(err.message, 'danger');
      }
    }

    function filtered() {
      return allIncidents.filter((i) => {
        const matchesStatus = statusFilter === 'All' || i.status === statusFilter;
        const matchesSearch = !searchTerm || i.location.toLowerCase().includes(searchTerm) || i.type.toLowerCase().includes(searchTerm);
        return matchesStatus && matchesSearch;
      });
    }

    function renderTable() {
      const tbody = document.getElementById('incidentsTbody');
      const rows = filtered();
      const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
      currentPage = Math.min(currentPage, totalPages);
      const pageRows = rows.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

      if (!pageRows.length) {
        tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state"><div class="icon-wrap"><i data-lucide="siren" class="icon"></i></div><h4>No incidents found</h4><p>Try a different search or filter.</p></div></td></tr>`;
      } else {
        tbody.innerHTML = pageRows.map((i) => `
          <tr>
            <td style="font-weight:600;">${i.location}</td>
            <td>${i.type}</td>
            <td><span class="badge ${SEVERITY_BADGE[i.severity] || 'badge-neutral'}">${i.severity}</span></td>
            <td><span class="badge ${STATUS_BADGE[i.status] || 'badge-neutral'}">${i.status}</span></td>
            <td>
              <div class="row-actions">
                ${i.status === 'Active' ? `<button class="btn-icon" title="Assign truck" onclick="openAssignModal(${i.id})"><i data-lucide="truck" class="icon" style="width:15px;height:15px;"></i></button>` : ''}
                ${i.status !== 'Resolved' ? `<button class="btn-icon" title="Resolve" onclick="confirmResolve(${i.id})"><i data-lucide="check-circle-2" class="icon" style="width:15px;height:15px;"></i></button>` : ''}
              </div>
            </td>
          </tr>
        `).join('');
      }

      document.getElementById('paginationInfo').textContent = rows.length
        ? `Showing ${(currentPage - 1) * PAGE_SIZE + 1}–${Math.min(currentPage * PAGE_SIZE, rows.length)} of ${rows.length}`
        : 'No results';

      const btns = document.getElementById('paginationBtns');
      let html = `<button ${currentPage === 1 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1})"><i data-lucide="chevron-left" class="icon" style="width:14px;height:14px;"></i></button>`;
      for (let p = 1; p <= totalPages; p++) html += `<button class="${p === currentPage ? 'active' : ''}" onclick="goToPage(${p})">${p}</button>`;
      html += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="goToPage(${currentPage + 1})"><i data-lucide="chevron-right" class="icon" style="width:14px;height:14px;"></i></button>`;
      btns.innerHTML = html;

      if (window.lucide) window.lucide.createIcons();
    }

    function goToPage(p) { currentPage = p; renderTable(); }

    function openCreateModal() {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal card">
          <div class="modal-header"><h3>Create incident</h3><button class="modal-close" id="closeModal"><i data-lucide="x" class="icon"></i></button></div>
          <div id="modalBanner" class="banner banner-danger hidden"><i data-lucide="alert-circle" class="icon"></i><span></span></div>
          <form id="incidentForm" novalidate>
            <div class="field"><input type="text" id="mLocation" placeholder=" " required><label>Location</label></div>
            <div class="field"><input type="text" id="mType" placeholder=" " required><label>Incident type (e.g. Structure fire)</label></div>
            <div class="field">
              <select id="mSeverity" style="width:100%; height:52px; padding:0 16px; border-radius:8px; border:1.5px solid var(--border-strong); background:var(--bg-surface); color:var(--text-primary);">
                <option>Low</option><option>Medium</option><option selected>High</option><option>Critical</option>
              </select>
            </div>
          </form>
          <div class="modal-footer">
            <button class="btn btn-secondary" id="cancelModal">Cancel</button>
            <button class="btn btn-primary" id="saveModal">Create incident</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      requestAnimationFrame(() => overlay.classList.add('open'));
      if (window.lucide) window.lucide.createIcons();

      const close = () => { overlay.classList.remove('open'); setTimeout(() => overlay.remove(), 200); };
      overlay.querySelector('#closeModal').addEventListener('click', close);
      overlay.querySelector('#cancelModal').addEventListener('click', close);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });

      overlay.querySelector('#saveModal').addEventListener('click', async () => {
        const btn = overlay.querySelector('#saveModal');
        const banner = overlay.querySelector('#modalBanner');
        const location = overlay.querySelector('#mLocation').value.trim();
        const type = overlay.querySelector('#mType').value.trim();
        const severity = overlay.querySelector('#mSeverity').value;
        if (!location || !type) { banner.classList.remove('hidden'); banner.querySelector('span').textContent = 'Location and type are required.'; return; }
        try {
          setButtonLoading(btn, true, 'Creating…');
          await apiAuth('/incidents', { method: 'POST', body: JSON.stringify({ location, type, severity }) });
          showToast('Incident created.', 'success');
          close();
          loadData();
        } catch (err) {
          banner.classList.remove('hidden');
          banner.querySelector('span').textContent = err.message;
          setButtonLoading(btn, false);
        }
      });
    }

    function openAssignModal(incidentId) {
      const available = trucks.filter((t) => t.status === 'Available');
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal card">
          <div class="modal-header"><h3>Assign truck</h3><button class="modal-close" id="closeModal"><i data-lucide="x" class="icon"></i></button></div>
          <div id="modalBanner" class="banner banner-danger hidden"><i data-lucide="alert-circle" class="icon"></i><span></span></div>
          ${available.length ? `
          <form id="assignForm" novalidate>
            <div class="field">
              <select id="mTruck" style="width:100%; height:52px; padding:0 16px; border-radius:8px; border:1.5px solid var(--border-strong); background:var(--bg-surface); color:var(--text-primary);">
                ${available.map((t) => `<option value="${t.id}">${t.code}${t.type ? ' — ' + t.type : ''}${t.station_name ? ' (' + t.station_name + ')' : ''}</option>`).join('')}
              </select>
            </div>
          </form>` : `<div class="empty-state"><div class="icon-wrap"><i data-lucide="truck" class="icon"></i></div><h4>No trucks available</h4><p>Every truck is currently busy or in maintenance.</p></div>`}
          <div class="modal-footer">
            <button class="btn btn-secondary" id="cancelModal">Cancel</button>
            ${available.length ? '<button class="btn btn-primary" id="saveModal">Assign</button>' : ''}
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      requestAnimationFrame(() => overlay.classList.add('open'));
      if (window.lucide) window.lucide.createIcons();

      const close = () => { overlay.classList.remove('open'); setTimeout(() => overlay.remove(), 200); };
      overlay.querySelector('#closeModal').addEventListener('click', close);
      overlay.querySelector('#cancelModal').addEventListener('click', close);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });

      overlay.querySelector('#saveModal')?.addEventListener('click', async () => {
        const btn = overlay.querySelector('#saveModal');
        const banner = overlay.querySelector('#modalBanner');
        const truckId = overlay.querySelector('#mTruck').value;
        try {
          setButtonLoading(btn, true, 'Assigning…');
          await apiAuth('/dispatch', { method: 'POST', body: JSON.stringify({ incidentId, truckId }) });
          showToast('Truck dispatched.', 'success');
          close();
          loadData();
        } catch (err) {
          banner.classList.remove('hidden');
          banner.querySelector('span').textContent = err.message;
          setButtonLoading(btn, false);
        }
      });
    }

    function confirmResolve(id) {
      const inc = allIncidents.find((i) => i.id === id);
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal card" style="max-width:380px;">
          <div class="modal-header"><h3>Resolve incident?</h3><button class="modal-close" id="closeConfirm"><i data-lucide="x" class="icon"></i></button></div>
          <p style="font-size:13.5px; color:var(--text-secondary);">Mark the incident at ${inc.location} as resolved.</p>
          <div class="modal-footer">
            <button class="btn btn-secondary" id="cancelConfirm">Cancel</button>
            <button class="btn btn-primary" id="confirmBtn">Resolve</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      requestAnimationFrame(() => overlay.classList.add('open'));
      if (window.lucide) window.lucide.createIcons();

      const close = () => { overlay.classList.remove('open'); setTimeout(() => overlay.remove(), 200); };
      overlay.querySelector('#closeConfirm').addEventListener('click', close);
      overlay.querySelector('#cancelConfirm').addEventListener('click', close);
      overlay.querySelector('#confirmBtn').addEventListener('click', async () => {
        try {
          await apiAuth(`/incidents/${id}`, { method: 'PATCH', body: JSON.stringify({ status: 'Resolved' }) });
          showToast('Incident resolved.', 'success');
          close();
          loadData();
        } catch (err) {
          showToast(err.message, 'danger');
        }
      });
    }
  </script>
</body>
</html>
